name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/

      - name: Configure Android signing and SDK paths
        run: |
          # Debug keystore (skip if one already exists)
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore ~/.android/debug.keystore \
              -storepass android -dname "CN=Android Debug,O=Android,C=US" \
              -validity 9999 -deststoretype pkcs12
          fi

          # Locate SDKs (fall back to the paths used by the godot-ci image)
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          JAVA_SDK="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(which java)")")")}"
          echo "Android SDK: $ANDROID_SDK"
          echo "Java SDK:    $JAVA_SDK"
          ls "$ANDROID_SDK" || echo "WARNING: Android SDK path not found"

          # Godot editor settings (needs a valid .tres header to be parsed)
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/java_sdk_path = "$JAVA_SDK"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project resources
        run: godot --headless --verbose --import || true

      - name: Build Android APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-App-APK
          path: build/android/app.apk
